<ng-template #content>
  <ng-content />
</ng-template>

@if (href(); as link) {
  <a
    [href]="link"
    [target]="target()"
    [attr.rel]="target() === '_blank' ? 'noopener noreferrer' : null"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    [type]="type()"
    [disabled]="disabled()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
