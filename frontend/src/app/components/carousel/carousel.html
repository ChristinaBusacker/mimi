<div class="carousel">
  <div class="controls">
    <button
      type="button"
      data-glide-dir="<"
      [attr.aria-label]="previousLabel()"
      (click)="previous()"
    >
      ‹
    </button>
  </div>

  <div #root class="glide">
    <div class="glide__track" data-glide-el="track">
      <div class="glide__slides">
        <ng-content />
      </div>
    </div>
  </div>

  <div class="controls">
    <button
      type="button"
      data-glide-dir=">"
      class="right"
      [attr.aria-label]="nextLabel()"
      (click)="next()"
    >
      ›
    </button>
  </div>
</div>
@if (showBullets() && bulletCount() > 1) {
  <nav class="carousel__bullets" aria-label="Carousel pagination">
    @for (index of bulletIndices(); track index) {
      <button
        type="button"
        [class.is-active]="currentSlide() === index"
        [attr.aria-current]="currentSlide() === index ? 'true' : null"
        [attr.aria-label]="'Bild ' + (index + 1)"
        (click)="selectSlide(index)"
      ></button>
    }
  </nav>
}
