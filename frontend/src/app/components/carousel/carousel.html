<div #root class="carousel glide">
  <div
    class="glide__track"
    data-glide-el="track"
  >
    <div class="glide__slides">
      <ng-content />
    </div>
  </div>

  <div
    class="controls"
    data-glide-el="controls"
  >
    <button
      type="button"
      data-glide-dir="<"
      [attr.aria-label]="previousLabel()"
    >
      ‹
    </button>

    <button
      type="button"
      data-glide-dir=">"
      [attr.aria-label]="nextLabel()"
    >
      ›
    </button>
  </div>
</div>
