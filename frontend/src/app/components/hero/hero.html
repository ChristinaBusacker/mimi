<section class="hero">
  <div
    class="content"
    [class.music]="type() === 'music'"
    [class.chatting]="type() === 'chatting'"
    [class.gaming]="type() === 'gaming'"
    [class.community]="type() === 'community'"
    [class.gradient-rtl]="gradientDirection() === 'rtl'"
  >
    <div class="background-image" [style.background-image]="'url(' + background() + ')'"></div>
    <div class="left">
      <ng-content select="[hero-left]" />
    </div>

    <div class="right">
      <ng-content select="[hero-right]" />
    </div>
  </div>
</section>
