<ng-template #content>
  <span class="support-button__heart" aria-hidden="true">
    <app-icon name="heart" />
  </span>

  @if (!compact()) {
    <span class="support-button__label">
      <ng-content />
    </span>
  }
</ng-template>

@if (href(); as link) {
  <a
    class="support-button"
    [class.compact]="compact()"
    [href]="link"
    [target]="target()"
    [attr.rel]="target() === '_blank' ? 'noopener noreferrer' : null"
    [attr.aria-label]="ariaLabel()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    class="support-button"
    [class.compact]="compact()"
    [type]="type()"
    [attr.aria-label]="ariaLabel()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
