<section class="admin-login">
  <div class="admin-login__card">
    <header>
      <h1>{{ 'admin.login.title' | i18n | async }}</h1>
      <p>{{ 'admin.login.subtitle' | i18n | async }}</p>
    </header>

    @if (errorKey(); as error) {
      <p class="admin-login__error" role="alert">
        {{ error | i18n | async }}
      </p>
    }

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <label>
        <span>{{ 'admin.login.email' | i18n | async }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
        />
      </label>

      <label>
        <span>{{ 'admin.login.password' | i18n | async }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>

      <app-button
        class="primary round"
        type="submit"
        [disabled]="submitting()"
      >
        {{ 'admin.login.action' | i18n | async }}
      </app-button>
    </form>
  </div>
</section>
