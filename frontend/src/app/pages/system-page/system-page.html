@if (page(); as entry) {
  <article class="site-page">
    <app-page-renderer [document]="entry.document" [locale]="language()" />
  </article>
} @else {
  @switch (slug) {
    @case ('about') {
      <app-about />
    }
    @case ('impressum') {
      <app-legal-notice />
    }
    @case ('datenschutz') {
      <app-privacy />
    }
  }
}
